[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-observability-deepagents"
version = "0.1.0"
description = "Langfuse and OpenTelemetry callback for Deep Agents"
requires-python = ">=3.10"
dependencies = ["langchain-core>=1,<2"]

[tool.setuptools]
py-modules = ["agent_observability"]
