server:
  http_listen_address: 127.0.0.1
  http_listen_port: 13200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 19095
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:14328
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: local
    wal:
      path: tempo-data/wal
    local:
      path: tempo-data/blocks
