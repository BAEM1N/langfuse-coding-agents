receivers:
  otlp/local:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
  otlp/goose:
    protocols:
      http:
        endpoint: 127.0.0.1:14320

exporters:
  file:
    path: ${env:CODING_AGENT_OTLP_FILE}
    rotation:
      max_megabytes: 20
      max_days: 7
      max_backups: 3
  otlp_http/langfuse:
    traces_endpoint: ${env:CODING_AGENT_LANGFUSE_OTLP_URL}
    headers:
      Authorization: ${env:CODING_AGENT_LANGFUSE_AUTH}
  otlp_http/tempo:
    traces_endpoint: ${env:CODING_AGENT_TEMPO_TRACES_URL}

processors:
  resource/local-user:
    attributes:
      - key: user.id
        value: ${env:CODING_AGENT_COLLECTOR_USER}
        action: insert
      - key: os.type
        value: ${env:CODING_AGENT_COLLECTOR_OS}
        action: insert
      - key: os.version
        value: ${env:CODING_AGENT_COLLECTOR_OS_VERSION}
        action: insert
      - key: host.arch
        value: ${env:CODING_AGENT_COLLECTOR_ARCH}
        action: insert
      - key: deployment.environment.name
        value: ${env:CODING_AGENT_COLLECTOR_ENVIRONMENT}
        action: insert

service:
  telemetry:
    metrics:
      level: none
      readers: []
  pipelines:
    traces/local:
      receivers: [otlp/local]
      exporters: [file, otlp_http/tempo]
    traces/goose:
      receivers: [otlp/goose]
      processors: [resource/local-user]
      exporters: [file, otlp_http/langfuse, otlp_http/tempo]
